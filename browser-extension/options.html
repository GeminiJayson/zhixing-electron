<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>知行 ZhiXing 密码助手 — 设置</title>
    <style>
      body { max-width: 560px; margin: 40px auto; padding: 0 20px;
        font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2937; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #6b7280; margin: 0 0 24px; }
      label { display: block; font-weight: 500; margin: 16px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px;
        border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
      button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 8px;
        background: #0e7490; color: #fff; font: inherit; cursor: pointer; }
      .hint { color: #6b7280; font-size: 12px; margin-top: 6px; }
      .status { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #f3f4f6; }
      .ok { background: #ecfdf5; color: #065f46; }
      .bad { background: #fef2f2; color: #991b1b; }
      ol { padding-left: 20px; color: #374151; }
      code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>知行 ZhiXing 密码助手</h1>
    <p class="sub">
      这个扩展只把凭据发到 <code>127.0.0.1</code>（你自己的电脑），不联网、不上传。
    </p>

    <ol>
      <li>打开知行 ZhiXing 桌面应用</li>
      <li>进入「保险箱」页，解锁之后点「连接浏览器」</li>
      <li>把那里显示的令牌复制过来，粘贴在下面</li>
    </ol>

    <label for="token">访问令牌</label>
    <input id="token" type="text" placeholder="32 位十六进制串" autocomplete="off" spellcheck="false" />
    <div class="hint">令牌只存在这台机器上，用来防止其它程序往你的保险箱里写东西。</div>

    <button id="save">保存</button>
    <button id="test" style="background: #4b5563">测试连接</button>

    <div id="status" class="status" hidden></div>

    <script src="options.js"></script>
  </body>
</html>
