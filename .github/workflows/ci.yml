name: CI

# 静态检查与单元测试。
# 这一层**不启动 Electron**，所以跑在 ubuntu 上、几十秒内出结果 ——
# 它是每次提交都要过的门。需要真实窗口的验证在 e2e.yml（windows-latest）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（主进程 / 预加载 / 渲染进程）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 控件高度一致性（静态扫描）
        run: npm run check:ctlheight

      - name: 主题对比度（WCAG 2.1）
        run: npm run check:contrast
