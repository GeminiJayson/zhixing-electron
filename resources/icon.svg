<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    知行 ZhiXing 应用图标（真源）。

    两层含义：
      底  —— **透明**（不带底板）。原先这里是一个深墨渐变的圆角方，
            在浅色任务栏与暗色任务栏上都像"一块黑底"（用户要求取消）。
      中  —— 打开的**书**（知识 / 知），填色是**弱化的强调色**：
            {{ACCENT_SOFT}}（强调色向所在底色混 55%，只留色相、不抢眼）
      顶  —— 左页两条文字线 + 右页的**对勾**（行动 / 行），用 {{ACCENT_SOFT}} 压深一档
      底部一层强调色光晕，让图标脱离"纯扁平"。

    颜色占位符由 scripts/gen-app-icons.cjs 按强调色替换：
      {{ACCENT_SOFT}}       弱化的强调色（向白混 55%，书页主色）
      {{ACCENT_SOFT_LIGHT}} 再提亮一档（渐变上端）
      {{ACCENT_SOFT_DARK}}  再压暗一档（渐变下端 / 文字线与对勾）
      {{ACCENT}}            强调色本体（只用于底部光晕）
  -->
  <defs>
    <linearGradient id="page" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="{{ACCENT_SOFT_LIGHT}}"/>
      <stop offset="0.5" stop-color="{{ACCENT_SOFT}}"/>
      <stop offset="1" stop-color="{{ACCENT_SOFT_DARK}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{{ACCENT}}" stop-opacity="0.30"/>
      <stop offset="1" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="196" rx="92" ry="40" fill="url(#glow)"/>
  <path d="M128 88
           C112 73 86 67 62 71
           C56 72 52 76 52 82
           V168 C52 175 57 179 64 178
           C86 175 111 179 128 194
           C145 179 170 175 192 178
           C199 179 204 175 204 168
           V82 C204 76 200 72 194 71
           C170 67 144 73 128 88 Z" fill="url(#page)"/>
  <path d="M128 88 V194" stroke="{{ACCENT_SOFT_DARK}}" stroke-opacity="0.35" stroke-width="5"/>
  <path d="M76 100 H108" stroke="{{ACCENT_SOFT_DARK}}" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <path d="M76 122 H108" stroke="{{ACCENT_SOFT_DARK}}" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 143 L119 166 L163 116" fill="none" stroke="{{ACCENT_SOFT_DARK}}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
