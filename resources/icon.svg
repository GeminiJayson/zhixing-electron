<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    知行 ZhiXing 应用图标（真源）。

    三层含义：
      底  —— 深墨渐变圆角方（固定，不随主题）
      中  —— 打开的**书**（知识 / 知），填色随主题强调色
      顶  —— 左页两条文字线 + 右页的**对勾**（行动 / 行），固定白
      另有底部一层强调色光晕，让图标脱离"纯扁平"。

    颜色占位符由 scripts/gen-app-icons.mjs 按强调色替换：
      {{ACCENT}}       强调色本体
      {{ACCENT_LIGHT}} 强调色提亮一档（渐变上端）
      {{ACCENT_DARK}}  强调色压暗一档（渐变下端）
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2B3A52"/>
      <stop offset="0.55" stop-color="#18223A"/>
      <stop offset="1" stop-color="#0C1322"/>
    </linearGradient>
    <linearGradient id="page" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="{{ACCENT_LIGHT}}"/>
      <stop offset="0.5" stop-color="{{ACCENT}}"/>
      <stop offset="1" stop-color="{{ACCENT_DARK}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{{ACCENT}}" stop-opacity="0.30"/>
      <stop offset="1" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="60" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="60" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <ellipse cx="128" cy="196" rx="92" ry="40" fill="url(#glow)"/>
  <path d="M128 88
           C112 73 86 67 62 71
           C56 72 52 76 52 82
           V168 C52 175 57 179 64 178
           C86 175 111 179 128 194
           C145 179 170 175 192 178
           C199 179 204 175 204 168
           V82 C204 76 200 72 194 71
           C170 67 144 73 128 88 Z" fill="url(#page)"/>
  <path d="M128 88 V194" stroke="#0A1120" stroke-opacity="0.30" stroke-width="5"/>
  <path d="M76 100 H108" stroke="#ffffff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>
  <path d="M76 122 H108" stroke="#ffffff" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 143 L119 166 L163 116" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
